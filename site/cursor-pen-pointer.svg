  <path d="M27.4 24.3 L29.6 26.5 C30.6 27.5 30.6 29.1 29.6 30.1 C28.6 31.1 27.0 31.1 26.0 30.1 L23.8 27.9 Z" fill="#CF4432"/>
  <line x1="27.4" y1="24.4" x2="23.9" y2="27.9" stroke="#F0CF95" stroke-width="1.0"/>

