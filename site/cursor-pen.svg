<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <linearGradient id="nibMetal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#8C6229"/>
      <stop offset="48%" stop-color="#DFB876"/>
      <stop offset="78%" stop-color="#F8E5BE"/>
      <stop offset="100%" stop-color="#B78943"/>
    </linearGradient>
    <linearGradient id="woodBarrel" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#16100E"/>
      <stop offset="45%" stop-color="#3A251E"/>
      <stop offset="76%" stop-color="#5C3B30"/>
      <stop offset="100%" stop-color="#261814"/>
    </linearGradient>
  </defs>

  <!-- Universal vector ambient shadow (works in 100% of browsers' cursor rasterizers) -->
  <g transform="translate(1.0, 1.5)" opacity="0.24" fill="#0D0B09" stroke="#0D0B09" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M3 3 L12.0 7.4 L13.5 10.3 L10.3 13.5 L7.4 12.0 Z"/>
    <path d="M13.1 10.0 L15.1 12.0 L12.0 15.1 L10.0 13.1 Z"/>
    <path d="M13.3 10.2 L29.6 26.5 C30.6 27.5 30.6 29.2 29.6 30.2 C28.6 31.2 26.9 31.2 25.9 30.2 L9.6 13.9 Z"/>
  </g>

  <!-- Seamless die-cut parchment halo hugging nib + collar + barrel + finial -->
  <g stroke="#FAF6EE" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round">
    <path d="M3 3 L12.0 7.4 L13.5 10.3 L10.3 13.5 L7.4 12.0 Z" fill="#FAF6EE"/>
    <path d="M13.1 10.0 L15.1 12.0 L12.0 15.1 L10.0 13.1 Z" fill="#FAF6EE"/>
    <path d="M13.3 10.2 L29.6 26.5 C30.6 27.5 30.6 29.2 29.6 30.2 C28.6 31.2 26.9 31.2 25.9 30.2 L9.6 13.9 Z" fill="#FAF6EE"/>
  </g>

  <!-- Rosewood / Walnut Tapered Barrel -->
  <path d="M13.3 10.2 L28.1 25.0 L24.4 28.7 L9.6 13.9 Z" fill="url(#woodBarrel)"/>
  <line x1="14.1" y1="11.9" x2="27.0" y2="24.8" stroke="#8C6454" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.78"/>

  <!-- Vermilion Lacquer Finial (Artist Chop Seal Accent) -->
  <path d="M27.4 24.3 L29.6 26.5 C30.6 27.5 30.6 29.1 29.6 30.1 C28.6 31.1 27.0 31.1 26.0 30.1 L23.8 27.9 Z" fill="#B63B2B"/>
  <line x1="27.4" y1="24.4" x2="23.9" y2="27.9" stroke="#E5C185" stroke-width="0.95"/>

  <!-- Burnished Brass Ferrule Collar -->
  <path d="M13.1 10.0 L15.1 12.0 L11.4 15.7 L9.4 13.7 Z" fill="url(#nibMetal)" stroke="#5E4019" stroke-width="0.45"/>

  <!-- Sculpted Split Fountain/Dip Pen Nib -->
  <path d="M3 3 L12.0 7.4 L13.5 10.3 L10.3 13.5 L7.4 12.0 Z" fill="url(#nibMetal)" stroke="#4A3314" stroke-width="0.55" stroke-linejoin="round"/>

  <!-- Nib Slit & Breather Hole -->
  <line x1="3.35" y1="3.35" x2="8.7" y2="8.7" stroke="#2B1D0E" stroke-width="0.68" stroke-linecap="round"/>
  <circle cx="9.0" cy="9.0" r="1.12" fill="#2B1D0E"/>

  <!-- Crisp Sumi Ink Tip Point at (3,3) -->
  <path d="M3 3 L5.7 4.3 L4.3 5.7 Z" fill="#181614"/>
</svg>
