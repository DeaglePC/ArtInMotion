<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="ArtInMotion · 逐笔绘画工作室">
  <defs>
    <linearGradient id="darkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171513"/>
      <stop offset="100%" stop-color="#100F0E"/>
    </linearGradient>
    <linearGradient id="strokeGradDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C84B39" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#C89D66" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#EFEAE0" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Obsidian screening room card -->
  <rect x="1" y="1" width="958" height="218" rx="12" fill="url(#darkBg)" stroke="#2C2824" stroke-width="1.5"/>
  <rect x="14" y="14" width="932" height="192" rx="6" fill="none" stroke="#221F1C" stroke-width="1"/>

  <!-- Subtle corner gallery crop marks -->
  <path d="M28 40 V28 H40 M932 40 V28 H920 M28 180 V192 H40 M932 180 V192 H920" fill="none" stroke="#574F46" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Decorative tapered brushstroke curve -->
  <path d="M210 154 C 350 142, 570 144, 750 154" fill="none" stroke="url(#strokeGradDark)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="210" cy="154" r="2.6" fill="#C84B39"/>

  <!-- Top catalog label -->
  <text x="480" y="54" text-anchor="middle" fill="#9E9385" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3.5">LOCAL ALGORITHMIC ATELIER · 20 MEDIA · 68 TRANSITIONS</text>

  <!-- Main Title -->
  <text x="462" y="112" text-anchor="middle" fill="#F3EEE4" font-family="Georgia, 'Times New Roman', 'Noto Serif SC', 'Songti SC', serif" font-size="44" font-weight="600" letter-spacing="1.5">ArtInMotion</text>

  <!-- Vermilion artist chop seal -->
  <g transform="translate(612, 79)">
    <rect x="0" y="0" width="38" height="38" rx="4" fill="#B83E2E"/>
    <rect x="2.5" y="2.5" width="33" height="33" rx="2" fill="none" stroke="#F3EEE4" stroke-width="1" stroke-opacity="0.65"/>
    <text x="19" y="17" text-anchor="middle" fill="#FAF7F0" font-family="'Noto Serif SC', 'Songti SC', SimSun, serif" font-size="12" font-weight="700">逐笔</text>
    <text x="19" y="31" text-anchor="middle" fill="#FAF7F0" font-family="'Noto Serif SC', 'Songti SC', SimSun, serif" font-size="12" font-weight="700">成画</text>
  </g>

  <!-- Subtitle -->
  <text x="480" y="142" text-anchor="middle" fill="#D5CCBF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5" letter-spacing="2.5">逐笔绘画工作室 · 把一张照片画成一部 24 秒的有声短片</text>

  <!-- Bottom technical specs -->
  <text x="480" y="182" text-anchor="middle" fill="#8E8477" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" letter-spacing="0.8">无需生图大模型 · 无需 API Key · 真实落笔声与本机合成钢琴 · 同步导出高清成画与 MP4</text>
</svg>
